# The full VSM routing matrix. This file is the research object: the Phase 9
# ablation swaps it for flat.yaml with no code change.
#
# The matrix is TOTAL. The catch-all deny (default_deny) matches every cell, so
# every (sender, recipient, channel) triple resolves to a named rule; specific
# rules win by specificity. Authorization is scoped by intent, which is how an S1
# may report accountability upward on COMMAND without being able to command.

name: vsm
version: 1
default_effect: deny

channels:
  command:
    enabled: true
    maxsize: 256
    overflow: block
    allowed_intents: [policy, allocation, intervention, accountability, pause, resume]
  coordination:
    enabled: true
    maxsize: 256
    overflow: block
    allowed_intents: [claim, release, arbitrate, lateral, homeostat]
  audit:
    enabled: true
    maxsize: 64
    overflow: block
    allowed_intents: [sample_request, finding, charter_diff]
  algedonic:
    # The bypass is never dropped: an unbounded, never-blocking inbox. Dropping a
    # pain signal defeats the entire point of the channel.
    enabled: true
    maxsize: 0
    overflow: drop_newest
    allowed_intents: [pain, pleasure, ack, resolve]
  environment:
    enabled: true
    maxsize: 1024
    overflow: drop_oldest
    allowed_intents: [observation, forecast]

rules:
  # Catch-all, most general, lowest specificity. Everything not explicitly on the
  # VSM map is denied, and the denial is visible here rather than implicit.
  - {id: default_deny, sender: "*", recipient: "*", channel: "*", effect: deny,
     reason: "not on the VSM map"}

  # COMMAND axis. S5 sets policy to the metasystem (S3, S4) and does not reach
  # into operations; S3 owns the resource bargain with S1; S1 reports upward.
  - {id: cmd_s5_s3_policy, sender: s5, recipient: s3, channel: command, intent: policy,
     effect: allow, reason: "S5 sets policy to control"}
  - {id: cmd_s5_s4_policy, sender: s5, recipient: s4, channel: command, intent: policy,
     effect: allow, reason: "S5 sets policy to intelligence"}
  - {id: cmd_s3_s1_alloc, sender: s3, recipient: s1, channel: command, intent: allocation,
     effect: allow, reason: "resource bargain, downward"}
  - {id: cmd_s3_s1_intervene, sender: s3, recipient: s1, channel: command, intent: intervention,
     effect: allow, reason: "Beer V1: intervention spends S1 autonomy"}
  - {id: cmd_s3_s1_pause, sender: s3, recipient: s1, channel: command, intent: pause,
     effect: allow, reason: "S3 pauses an over-budget worker"}
  - {id: cmd_s3_s1_resume, sender: s3, recipient: s1, channel: command, intent: resume,
     effect: allow, reason: "S3 resumes a worker"}
  - {id: cmd_s1_s3_account, sender: s1, recipient: s3, channel: command, intent: accountability,
     effect: allow, reason: "closes Beer V2: accountability flows up as resources flow down"}

  # COORDINATION. S2 damps oscillation between S1 units; the S3/S4 homeostat rides
  # this channel with intent=homeostat (a declared collapse, see ARCHITECTURE.md).
  - {id: coord_s2_s1_arbitrate, sender: s2, recipient: s1, channel: coordination, intent: arbitrate,
     effect: allow, reason: "S2 arbitrates a claim conflict"}
  - {id: coord_s2_s1_lateral, sender: s2, recipient: s1, channel: coordination, intent: lateral,
     effect: allow, reason: "S2 lateral service to operations"}
  - {id: coord_s1_s2_claim, sender: s1, recipient: s2, channel: coordination, intent: claim,
     effect: allow, reason: "S1 claims work through the S2 ledger"}
  - {id: coord_s1_s2_release, sender: s1, recipient: s2, channel: coordination, intent: release,
     effect: allow, reason: "S1 releases a claim"}
  - {id: coord_s3_s4_homeostat, sender: s3, recipient: s4, channel: coordination, intent: homeostat,
     effect: allow, reason: "S3/S4 homeostat"}
  - {id: coord_s4_s3_homeostat, sender: s4, recipient: s3, channel: coordination, intent: homeostat,
     effect: allow, reason: "S3/S4 homeostat"}

  # AUDIT. S3* samples operations directly (Beer V4) and reports findings to S3.
  - {id: audit_s3star_s1_sample, sender: s3star, recipient: s1, channel: audit, intent: sample_request,
     effect: allow, reason: "V4: sporadic audit reads operations directly"}
  - {id: audit_s3star_s3_finding, sender: s3star, recipient: s3, channel: audit, intent: finding,
     effect: allow, reason: "audit findings return to control"}
  - {id: audit_s3star_s5_charter, sender: s3star, recipient: s5, channel: audit, intent: charter_diff,
     effect: allow, reason: "charter divergence surfaces to policy"}

  # ALGEDONIC. The bypass. Anything may raise pain or pleasure to the S5 seat and
  # to the human. It terminates nowhere else, or it is a broadcast, not a bypass.
  - {id: alg_any_s5, sender: "*", recipient: s5, channel: algedonic,
     effect: allow, reason: "the bypass: anything reaches policy"}
  - {id: alg_any_human, sender: "*", recipient: human, channel: algedonic,
     effect: allow, reason: "pain also surfaces to the human"}

  # ENVIRONMENT. Operations exchange with the local-and-now environment; S4 scans
  # the total-and-future environment (a declared collapse onto one channel).
  - {id: env_in_s1, sender: environment, recipient: s1, channel: environment, intent: observation,
     effect: allow, reason: "CI events enter at operations"}
  - {id: env_s1_out, sender: s1, recipient: environment, channel: environment, intent: observation,
     effect: allow, reason: "operations act on the environment (read-only in this fleet)"}
  - {id: env_in_s4, sender: environment, recipient: s4, channel: environment, intent: observation,
     effect: allow, reason: "S4 scans the environment"}
  - {id: env_s4_forecast, sender: s4, recipient: environment, channel: environment, intent: forecast,
     effect: allow, reason: "S4 emits forecasts about the environment"}

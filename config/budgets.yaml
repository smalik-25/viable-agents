# Budgets. S3 allocates against these; the algedonic cost-runaway detector fires
# against the burn rate derived from them.
#
# Phase 4 activates the allocator, Phase 6 the detector.
#
# These numbers are chosen so the FEATURES are demonstrable. A per-run budget far
# above the measured cost means S3 rubber-stamps and the cost detector never
# fires, and both become decorative. A budget far below it means every run is
# starved and the ablation measures starvation rather than topology.
#
# Note the per-agent caps deliberately sum to MORE than the pool. An allocator
# with slack is not an allocator: over-subscription is what forces S3 to
# arbitrate rather than approve everything.

default_run_budget_usd: "0.60"

# Per-ROLE reference lines, not per-instance hard caps -- the actual hard,
# per-agent-INSTANCE stop BudgetGuard enforces (llm/budget.py) comes from each
# agent's own `budget_usd` in config/fleet/vsm.yaml, which is built to sum to
# the matching role line here (e.g. the three S1 instances sum to 0.24).
per_agent_caps_usd:
  s1: "0.24"
  s3: "0.14"
  s5: "0.11"
  s3star: "0.11"
  s4: "0.07"
  # sums to 0.67 against a 0.60 pool

# The named Phase 4 graceful-degradation scenario: S3 must shed low-priority
# work rather than crash. Note this equals the S1 per-role line above, so a
# ONE-SHOT start-of-run allocation (grant each instance its nominal ask until
# the pool runs out) would shed nobody -- an exact break-even. Controller
# therefore does not allocate once at run start; it tracks cumulative spend
# against this pool on every accountability report and pauses the
# lowest-priority live S1 once remaining pool can no longer cover projected
# demand (and resumes the highest-priority paused one when headroom returns).
# This is what gives "sheds low-priority work" its literal meaning -- a
# running worker gets cut off -- and stays correct regardless of how these
# numbers get edited later.
starved_run_budget_usd: "0.24"

# Phase 6 cost-runaway detector. A RATE threshold over a sliding window, not a
# total-spend threshold: S3* audit passes are lumpy and a naive total-spend
# trigger would fire on the audit and pollute the false-positive count.
cost_runaway:
  k: 2.5              # multiple of the linear burn line
  window_events: 20
  warmup_events: 15

# Hard ceiling, enforced RUN-LOCAL for Phase 4: BudgetGuard refuses a call once
# cumulative spend within the CURRENT run reaches this, a real runaway-loop
# guard. True cross-run enforcement (summing historical llm_calls.cost_usd at
# run start so a month's worth of runs cannot quietly exceed it) needs a
# Postgres query the in-memory/synthetic default path structurally cannot
# perform, and is parked -- see PLAN.md's parking lot.
project_ceiling_usd: "50.00"
